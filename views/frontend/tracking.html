<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seguimiento de Pedido - Tengo Hambre</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Fuentes & Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JQUERY (Toastr requirement) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- TOASTR (Notifications) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <link rel="stylesheet" href="../assets/css/front.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#ff4757',
                        brandDark: '#e84118',
                        primary: '#ff4757',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 antialiased">

<div id="app" class="flex flex-col min-h-screen relative overflow-hidden" v-cloak>
    
    <!-- Loading Overlay -->
    <div v-if="loading" class="fixed inset-0 bg-white dark:bg-slate-950 z-50 flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-brand text-5xl mb-4"></i>
        <p class="font-bold text-slate-500 animate-pulse">Buscando tu pedido...</p>
    </div>

    <!-- Error Screen -->
    <div v-else-if="error" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center text-red-500 mb-6 text-3xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="text-2xl font-extrabold mb-2 dark:text-white">Pedido no encontrado</h2>
        <p class="text-slate-500 mb-8 max-w-sm">{{ error }}</p>
        <a href="/profile.html" class="px-6 py-3 bg-brand text-white font-bold rounded-xl shadow-lg shadow-brand/30 hover:scale-105 transition-transform">
            Volver a mi perfil
        </a>
    </div>

    <!-- Tracking Content -->
    <template v-else>
        
        <!-- Header (Fixed) -->
        <header class="fixed top-0 left-0 right-0 z-40 bg-slate-50 dark:bg-[#0b101e] p-4 flex items-center justify-between">
            <a href="/profile.html" class="w-10 h-10 bg-slate-200 dark:bg-white/10 rounded-full flex items-center justify-center text-slate-800 dark:text-white hover:bg-slate-300 dark:hover:bg-white/20 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="text-center">
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Pedido</p>
                <h1 class="text-sm font-extrabold text-slate-900 dark:text-white">#{{ order.orderNumber || order._id.slice(-6).toUpperCase() }}</h1>
            </div>
            <div class="w-10 h-10"></div> <!-- Spacer -->
        </header>

        <!-- Main Container -->
        <main class="flex-1 bg-slate-50 dark:bg-[#0b101e] pt-20 pb-24 px-4 min-h-screen">
            <div class="max-w-md mx-auto space-y-4">
                
                <!-- Banner Principal (Imagen completa) -->
                <div class="rounded-3xl overflow-hidden shadow-lg bg-slate-200 dark:bg-slate-800 min-h-[150px] flex items-center justify-center relative">
                    <transition
                        mode="out-in"
                        enter-active-class="transition-all duration-500 ease-out"
                        enter-from-class="opacity-0 translate-x-4 scale-95"
                        enter-to-class="opacity-100 translate-x-0 scale-100"
                        leave-active-class="transition-all duration-300 ease-in"
                        leave-from-class="opacity-100 translate-x-0 scale-100"
                        leave-to-class="opacity-0 -translate-x-4 scale-95"
                    >
                        <img :key="'step-img-' + (stepIndex || 1)" 
                             :src="`../assets/images/step${stepIndex >= 4 ? 4 : (stepIndex <= 1 ? 1 : stepIndex)}.png`" 
                             class="w-full h-auto block object-cover" 
                             alt="Estado de tu pedido" />
                    </transition>
                </div>

                <!-- Timeline Progress -->
                <div class="px-2 pt-6 pb-2">
                    <div class="relative flex justify-between items-start">
                        <!-- Linea de fondo -->
                        <div class="absolute top-5 left-8 right-8 h-1 bg-slate-300 dark:bg-slate-800 rounded-full"></div>
                        <!-- Linea de progreso activa -->
                        <div class="absolute top-5 left-8 h-1 bg-[#c80000] rounded-full transition-all duration-1000 ease-in-out" :style="{ width: progressWidth }"></div>

                        <!-- Step 1: Recibido -->
                        <div class="flex flex-col items-center relative z-10 w-1/4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg mb-2 shadow-sm transition-all duration-500"
                                 :class="stepIndex >= 1 ? (stepIndex === 1 ? 'bg-[#c80000] text-white border-2 border-white dark:border-[#0b101e] shadow-[0_0_15px_rgba(200,0,0,0.5)] scale-110' : 'bg-[#c80000] text-white border-2 border-[#c80000]') : 'bg-slate-200 dark:bg-slate-800 text-slate-500'">
                                <i class="fa-solid fa-receipt" :class="stepIndex === 1 ? 'animate-pulse' : ''"></i>
                                <transition enter-active-class="transition-all duration-300" enter-from-class="opacity-0 scale-0" enter-to-class="opacity-100 scale-100">
                                    <div v-if="stepIndex > 1" class="absolute -bottom-1 -right-1 bg-[#ffb800] text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold border-2 border-slate-50 dark:border-[#0b101e]">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </transition>
                            </div>
                            <span class="text-xs font-bold text-center leading-tight transition-all duration-300" :class="stepIndex >= 1 ? (stepIndex === 1 ? 'text-[#c80000] dark:text-[#ffb800] scale-105' : 'text-slate-900 dark:text-white') : 'text-slate-500'">Pedido<br>recibido</span>
                            <span v-if="stepIndex >= 1" class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">1:32 PM</span>
                        </div>
                        
                        <!-- Step 2: Preparando -->
                        <div class="flex flex-col items-center relative z-10 w-1/4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg mb-2 shadow-sm transition-all duration-500"
                                 :class="stepIndex >= 2 ? (stepIndex === 2 ? 'bg-[#c80000] text-white border-2 border-white dark:border-[#0b101e] shadow-[0_0_15px_rgba(200,0,0,0.5)] scale-110' : 'bg-[#c80000] text-white border-2 border-[#c80000]') : 'bg-slate-200 dark:bg-slate-800 text-slate-500'">
                                <i class="fa-solid fa-fire-burner" :class="stepIndex === 2 ? 'animate-pulse' : ''"></i>
                                <transition enter-active-class="transition-all duration-300" enter-from-class="opacity-0 scale-0" enter-to-class="opacity-100 scale-100">
                                    <div v-if="stepIndex > 2" class="absolute -bottom-1 -right-1 bg-[#ffb800] text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold border-2 border-slate-50 dark:border-[#0b101e]">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </transition>
                            </div>
                            <span class="text-xs font-bold text-center leading-tight transition-all duration-300" :class="stepIndex >= 2 ? (stepIndex === 2 ? 'text-[#c80000] dark:text-[#ffb800] scale-105' : 'text-slate-900 dark:text-white') : 'text-slate-500'">Restaurante<br>preparando</span>
                            <span v-if="stepIndex >= 2" class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">1:36 PM</span>
                        </div>
                        
                        <!-- Step 3: En Camino -->
                        <div class="flex flex-col items-center relative z-10 w-1/4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg mb-2 shadow-sm transition-all duration-500"
                                 :class="stepIndex >= 3 ? (stepIndex === 3 ? 'bg-[#c80000] text-white border-2 border-white dark:border-[#0b101e] shadow-[0_0_15px_rgba(200,0,0,0.5)] scale-110' : 'bg-[#c80000] text-white border-2 border-[#c80000]') : 'bg-slate-200 dark:bg-slate-800 text-slate-500'">
                                <i class="fa-solid fa-motorcycle" :class="stepIndex === 3 ? 'animate-pulse' : ''"></i>
                                <transition enter-active-class="transition-all duration-300" enter-from-class="opacity-0 scale-0" enter-to-class="opacity-100 scale-100">
                                    <div v-if="stepIndex > 3" class="absolute -bottom-1 -right-1 bg-[#ffb800] text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold border-2 border-slate-50 dark:border-[#0b101e]">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </transition>
                            </div>
                            <span class="text-xs font-bold text-center leading-tight transition-all duration-300" :class="stepIndex >= 3 ? (stepIndex === 3 ? 'text-[#c80000] dark:text-[#ffb800] scale-105' : 'text-slate-900 dark:text-white') : 'text-slate-500'">En camino</span>
                            <span v-if="stepIndex >= 3" class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">1:45 PM</span>
                        </div>

                        <!-- Step 4: Entregado -->
                        <div class="flex flex-col items-center relative z-10 w-1/4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg mb-2 shadow-sm transition-all duration-500"
                                 :class="stepIndex >= 4 ? (stepIndex === 4 ? 'bg-[#c80000] text-white border-2 border-white dark:border-[#0b101e] shadow-[0_0_15px_rgba(200,0,0,0.5)] scale-110' : 'bg-[#c80000] text-white border-2 border-[#c80000]') : 'bg-slate-200 dark:bg-slate-800 text-slate-500'">
                                <i class="fa-solid fa-bag-shopping" :class="stepIndex === 4 ? 'animate-pulse' : ''"></i>
                            </div>
                            <span class="text-xs font-bold text-center leading-tight transition-all duration-300" :class="stepIndex >= 4 ? (stepIndex === 4 ? 'text-[#c80000] dark:text-[#ffb800] scale-105' : 'text-slate-900 dark:text-white') : 'text-slate-500'">Entregado</span>
                            <span v-if="stepIndex < 4" class="text-[10px] text-slate-500 mt-1">Próximamente</span>
                            <span v-else class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">2:00 PM</span>
                        </div>
                    </div>
                </div>

                <!-- Restaurante Card -->
                <div class="bg-white dark:bg-slate-900/80 rounded-2xl p-4 mb-4 border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-full bg-slate-100 dark:bg-black overflow-hidden flex-shrink-0 border border-slate-200 dark:border-slate-700">
                            <img :src="businessInfo.avatar || '../assets/images/placeholder-restaurant.png'" alt="Restaurant Logo" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-0.5">Restaurante</p>
                            <h3 class="font-extrabold text-slate-900 dark:text-white text-base leading-tight">{{ businessInfo.name || 'Cargando...' }}</h3>
                            <p class="text-xs text-slate-600 dark:text-slate-400 mb-1">{{ businessInfo.description || 'Restaurante' }}</p>
                            <div class="flex items-center gap-1 text-[10px] text-slate-600 dark:text-slate-300">
                                <i class="fa-solid fa-heart text-[#c80000]"></i> Restaurante favorito
                            </div>
                        </div>
                    </div>
                    <a :href="'/menu/' + (businessInfo.slug || '')" class="px-4 py-2 rounded-full border border-slate-300 dark:border-[#ffb800] text-slate-700 dark:text-[#ffb800] text-xs font-bold flex items-center gap-1 hover:bg-slate-100 dark:hover:bg-[#ffb800] dark:hover:text-black transition">
                        Ver menú <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </a>
                </div>

                <!-- Detalles de Entrega -->
                <div class="bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-5 mb-6 border border-slate-100 dark:border-slate-800">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 flex-shrink-0">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Entregar en</p>
                            <p class="font-bold text-slate-800 dark:text-white text-sm">{{ order.customerStreet }} {{ order.customerNumber }}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ order.customerColony }}, C.P. {{ order.customerZipCode }}</p>
                            <p v-if="order.customerReference" class="text-xs text-slate-400 mt-2 bg-white dark:bg-slate-800 p-2 rounded-lg italic">
                                "{{ order.customerReference }}"
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Resumen de Orden -->
                <div class="mb-6">
                    <h3 class="font-extrabold text-slate-800 dark:text-white mb-4">Resumen del Pedido</h3>
                    <div class="space-y-3">
                        <div v-for="item in order.items" :key="item.product" class="flex justify-between items-start text-sm">
                            <div class="flex gap-2">
                                <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 w-6 h-6 rounded flex items-center justify-center font-bold text-xs flex-shrink-0">
                                    {{ item.quantity }}
                                </span>
                                <div>
                                    <p class="font-medium text-slate-800 dark:text-white">{{ item.name }}</p>
                                    <p v-if="item.selectedOptions && item.selectedOptions.length" class="text-xs text-slate-400">
                                        {{ item.selectedOptions.map(o => o.name).join(', ') }}
                                    </p>
                                    <p v-if="item.note" class="text-xs text-amber-500 italic mt-0.5">Nota: {{ item.note }}</p>
                                </div>
                            </div>
                            <span class="font-bold text-slate-800 dark:text-white">${{ (item.price * item.quantity).toFixed(2) }}</span>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 space-y-2 text-sm">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal</span>
                            <span>${{ order.subtotal?.toFixed(2) }}</span>
                        </div>
                        <div class="flex justify-between text-slate-500" v-if="order.deliveryCost > 0">
                            <span>Costo de envío</span>
                            <span>${{ order.deliveryCost?.toFixed(2) }}</span>
                        </div>
                        <div class="flex justify-between font-extrabold text-lg text-slate-800 dark:text-white mt-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                            <span>Total</span>
                            <span>${{ order.total?.toFixed(2) }}</span>
                        </div>
                    </div>
                </div>

                <!-- Call to action al restaurante / Promo Banner -->
                <div class="bg-white dark:bg-slate-900/80 rounded-2xl p-4 mb-8 border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-[#ffb800] flex items-center justify-center text-black font-bold text-xl flex-shrink-0">
                            <i class="fa-solid fa-gift"></i>
                        </div>
                        <div>
                            <h3 class="font-extrabold text-slate-900 dark:text-white text-sm">¡Gracias por elegir lo local!</h3>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">Sigamos apoyando a nuestros negocios.</p>
                        </div>
                    </div>
                    <a href="/" class="bg-[#c80000] text-white text-[10px] font-bold px-3 py-2 rounded-full whitespace-nowrap ml-2 hover:bg-red-700 transition">
                        Descubre más restaurantes <i class="fa-solid fa-chevron-right ml-1"></i>
                    </a>
                </div>

            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-[#0b101e] border-t border-slate-200 dark:border-slate-800 flex justify-around items-center pt-3 pb-6 px-2 z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] dark:shadow-none">
            <a href="/" class="flex flex-col items-center text-[#c80000]">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Inicio</span>
            </a>
            <a href="/search.html" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition">
                <i class="fa-solid fa-magnifying-glass text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Buscar</span>
            </a>
            <a href="/orders.html" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition">
                <i class="fa-solid fa-bag-shopping text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Pedidos</span>
            </a>
            <a href="/favorites.html" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition">
                <i class="fa-regular fa-heart text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Favoritos</span>
            </a>
            <a href="/profile.html" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition">
                <i class="fa-regular fa-user text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Perfil</span>
            </a>
        </nav>
        <!-- Review Modal -->
        <div v-if="showReviewModal" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity"></div>
            
            <div class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/50 rounded-3xl w-full max-w-[400px] shadow-2xl overflow-hidden animate-slide-up flex flex-col p-8 text-center z-10">
                
                <!-- Logo o Icono -->
                <div class="mx-auto w-16 h-16 bg-brand/10 text-brand rounded-full flex items-center justify-center mb-4 text-3xl">
                    <i class="fa-solid fa-star"></i>
                </div>

                <h2 class="text-2xl font-black text-slate-800 dark:text-white mb-2">Déjanos tu reseña</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mb-6 px-2">
                    ¿Qué te pareció tu pedido de <strong class="text-slate-800 dark:text-white">{{ businessInfo.name || 'este negocio' }}</strong>?
                </p>

                <!-- Formulario -->
                <div class="text-left space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Calificación</label>
                        <div class="flex gap-2 text-3xl text-slate-200 dark:text-slate-700 cursor-pointer justify-center my-2">
                            <i v-for="i in 5" :key="i" class="fa-solid fa-star hover:scale-110 transition-transform" 
                               :class="i <= newReview.rating ? 'text-yellow-400' : ''" 
                               @click="newReview.rating = i"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Tu Nombre</label>
                        <input v-model="newReview.customerName" type="text" placeholder="Ej: Juan Pérez" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 dark:text-white text-sm focus:outline-none focus:border-primary">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Comentarios</label>
                        <textarea v-model="newReview.comment" placeholder="La comida estuvo deliciosa..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 dark:text-white text-sm focus:outline-none focus:border-primary resize-none h-24"></textarea>
                    </div>

                    <button @click="submitReview" :disabled="submittingReview" class="w-full mt-2 bg-brand hover:bg-brandDark text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-50">
                        <i v-if="submittingReview" class="fa-solid fa-circle-notch fa-spin"></i>
                        <span v-else>Publicar Reseña y Continuar</span>
                    </button>
                    
                    <button v-if="!submittingReview" @click="skipReview" class="w-full text-sm text-slate-400 hover:text-slate-500 dark:hover:text-white font-medium transition mt-3">
                        Saltar y ver mis pedidos
                    </button>
                </div>
            </div>
        </div>

    </template>
</div>

<!-- Scripts -->
<script src="../assets/js/front/shared-customer.js"></script>
<script src="../assets/js/front/tracking.js"></script>
<script src="../assets/js/front/cookie-consent.js"></script>
</body>
</html>
