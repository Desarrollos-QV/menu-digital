<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital</title><!-- ID para el Favicon Dinámico -->
    <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Swiper JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- Toastr & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <link rel="stylesheet" href="./assets/css/front.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "xjyqvbmzyd");
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">
<div id="app" class="flex flex-col min-h-screen pb-20">
    <!-- PANTALLA ERROR / NO BUSINESS -->
    <div v-if="businessError" class="fixed inset-0 bg-slate-50 dark:bg-slate-950 z-50 flex flex-col items-center justify-center p-8 text-center">
        <div class="w-24 h-24 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center mb-6 text-4xl text-slate-400">
            <i class="fa-solid fa-store-slash"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">Negocio no encontrado</h1>
        <p class="text-slate-500 dark:text-slate-400 mb-6">Parece que el enlace es incorrecto o el negocio no está disponible.</p>
        <p class="text-xs text-slate-400">Prueba con ?slug=nombre-del-negocio</p>
    </div>

    <template v-else>
        <!-- PANTALLA DE ÉXITO DE COMPRA -->
        <div v-if="showSuccessScreen" class="min-h-[85vh] flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-800/50 p-6 md:p-8 text-center animate-fade-in">
                <!-- Icono de éxito -->
                <div class="w-24 h-24 bg-emerald-500 rounded-full flex items-center justify-center text-white text-5xl shadow-lg shadow-emerald-500/30 mb-6 mx-auto animate-pulse">
                    <i class="fa-solid fa-check"></i>
                </div>
                
                <h3 class="text-slate-500 dark:text-slate-400 text-base font-semibold">Gracias por tu compra,</h3>
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white mt-1">ha sido realizada con éxito</h2>
                <p class="text-sm font-medium text-slate-400 mt-2">Número de pedido #{{ lastOrderNumber }}</p>
                
                <!-- Tarjeta informativa de Pago Seguro -->
                <div class="bg-slate-50 dark:bg-slate-950 rounded-2xl p-5 border border-slate-100 dark:border-slate-800/80 my-6">
                    <div class="w-12 h-12 rounded-full bg-emerald-50 dark:bg-emerald-950/50 flex items-center justify-center text-emerald-500 text-xl mx-auto mb-3">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <p class="text-xs md:text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                        Tu pago es 100% seguro y respaldado por <strong class="text-slate-700 dark:text-slate-350">Tengo Hambre Inc</strong>, en dado caso que no te llegue tu pedido comunícate al
                    </p>
                    <a href="tel:8181894270" class="text-emerald-500 hover:text-emerald-600 font-extrabold text-2xl block mt-2 mb-1 tracking-wide">
                        81 8189 4270
                    </a>
                    <span class="text-xs text-slate-400">Y te resolveremos en seguida</span>
                </div>
                
                <!-- Botones de Acción -->
                <div class="space-y-3">
                    <div class="text-xs text-slate-600 dark:text-slate-400 mb-2 leading-relaxed bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-800/60 rounded-xl p-3 text-left flex items-start gap-2.5">
                        <i class="fa-solid fa-circle-info text-amber-500 mt-0.5 shrink-0 text-sm"></i>
                        <span><strong>Nota:</strong> Si WhatsApp no se abrió automáticamente, por favor presiona el botón verde de abajo para enviar tu pedido y confirmarlo con el negocio.</span>
                    </div>

                    <a v-if="!config.allowOnlineOrders && lastWhatsAppUrl" :href="lastWhatsAppUrl" target="_blank" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2 transition active:scale-95 text-base cursor-pointer">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>Enviar pedido por WhatsApp</span>
                    </a>
                    
                    <a v-if="config.allowOnlineOrders && lastOrderId" :href="'/tracking.html?orderId=' + lastOrderId" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-4 rounded-xl flex items-center justify-center transition active:scale-95 text-base cursor-pointer gap-2">
                        <span>Seguir Pedido</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <button v-else @click="goToMenu" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-4 rounded-xl flex items-center justify-center transition active:scale-95 text-base cursor-pointer">
                        <span>Volver al menú</span>
                    </button>
                </div>
            </div>
        </div>

        <template v-else>
            <!-- HEADER -->
            <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-sm px-4 pt-4 pb-3 transition-all duration-300 border-b border-transparent dark:border-slate-800" 
                    :class="{'shadow-md dark:shadow-slate-900/50': scrollY > 10}">
                <div class="max-w-7xl mx-auto">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <!-- Boton para volver al MarketPlace -->
                            <button @click="goToMarketplace" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-brand hover:text-white transition shadow-sm">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>

                            <!-- Avatar del Negocio -->
                            <div v-if="config.avatar" class="w-10 h-10 rounded-full overflow-hidden border border-slate-100 dark:border-slate-700 shadow-sm">
                                <img :src="config.avatar" class="w-full h-full object-cover">
                            </div>
                            <div v-else class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold shadow-sm shadow-primary/30">
                                {{ (config.appName || 'M')[0] }}
                            </div>
                            
                            <div class="cursor-pointer group select-none" @click="showBusinessModal = true">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h1 class="text-lg font-bold text-slate-800 dark:text-white leading-none group-hover:text-primary transition-colors">{{ config.appName || 'Cargando...' }} <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i></h1>
                                    <!-- Rating -->
                                    <span v-if="!isLoading" class="flex items-center gap-1 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-full"><i class="fa-solid fa-star text-yellow-400"></i> {{ config.calculatedRating }} <span class="text-[10px] text-slate-400 font-normal">({{config.reviewsCount}})</span></span>
                                    <!-- Badge Estado -->
                                    <span v-if="!isLoading"
                                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide transition-all"
                                        :class="isBusinessOpen ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'">
                                        <span class="w-1.5 h-1.5 rounded-full animate-pulse" :class="isBusinessOpen ? 'bg-emerald-500' : 'bg-red-500'"></span>
                                        {{ isBusinessOpen ? 'Abierto' : 'Cerrado' }}
                                    </span>
                                </div>
                                <!-- Horario del día / Info -->
                                <p v-if="todaySchedule && !isLoading" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium mt-1 flex items-center gap-1">
                                    <i class="fa-regular fa-clock text-[9px]"></i>
                                    <span v-if="todaySchedule.isOpen">{{ formatTime(todaySchedule.open) }} - {{ formatTime(todaySchedule.close) }}</span>
                                    <span v-else>Cerrado hoy</span>
                                    <span class="mx-1">&bull;</span>
                                    <i class="fa-solid fa-motorcycle text-[9px]"></i> {{ config.time || '30-45' }} min
                                </p>
                                <p v-else-if="!isLoading" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wide">Menú Digital</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button @click="toggleTheme" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 flex items-center justify-center transition-colors">
                                <i class="fa-solid" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
                            </button>
                            
                            <!-- ESTADO: LOGUEADO -->
                            <div v-if="currentUser" class="relative z-50" v-click-outside="() => showUserDropdown = false">
                                <button @click="showUserDropdown = !showUserDropdown" class="flex items-center gap-1.5 pl-2 pr-1 py-1 bg-slate-100 dark:bg-slate-800 rounded-full border border-slate-200/30 dark:border-slate-700 hover:shadow-md transition">
                                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200 hidden sm:block ml-1">{{ firstName }}</span>
                                    <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold shadow-sm overflow-hidden">
                                        <img v-if="userAvatarUrl" :src="userAvatarUrl" class="w-full h-full object-cover rounded-full">
                                        <span v-else>{{ userInitial }}</span>
                                    </div>
                                </button>

                                <!-- Dropdown User (Desktop click-open) -->
                                <div v-if="showUserDropdown" class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-100 dark:border-slate-700 py-2 animate-fade-in">
                                    <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700 mb-1">
                                        <p class="text-xs text-slate-400 font-bold">Hola, {{ currentUser.customer.name }}</p>
                                    </div>
                                    <a href="/profile" class="block w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 font-bold">
                                        <i class="fa-regular fa-user mr-2"></i> Mi Cuenta
                                    </a>
                                    <button @click="logout" class="block w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 font-bold border-t border-slate-100 dark:border-slate-700 mt-1">
                                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Cerrar Sesión
                                    </button>
                                </div>
                            </div>
                            
                            <!-- ESTADO: NO LOGUEADO -->
                            <button v-else @click="openModal('login')" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-brand hover:text-white transition shadow-sm" title="Iniciar Sesión">
                                <i class="fa-regular fa-user"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Buscador -->
                    <div class="relative w-full" v-if="!showCartModal">
                        <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input v-model="searchQuery" type="text" placeholder="¿Qué se te antoja hoy?" 
                            class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition shadow-inner dark:placeholder-slate-500">
                    </div>
                </div>
            </header>

            <!-- MAIN CONTENT -->
            <main class="flex-1 overflow-x-hidden">
                <div class="max-w-7xl mx-auto w-full"> 
                    <!-- LOADING SKELETON -->
                    <div v-if="isLoading" class="mt-4 px-4 space-y-6">
                        <div class="w-full h-40 md:h-64 rounded-2xl skeleton"></div>
                        <div class="flex space-x-3 overflow-hidden"><div v-for="i in 6" :key="i" class="flex flex-col items-center gap-2"><div class="w-14 h-14 rounded-2xl skeleton"></div></div></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"><div v-for="i in 6" :key="i" class="w-full h-28 rounded-2xl skeleton"></div></div>
                    </div>

                    <!-- REAL CONTENT -->
                    <div v-else class="animate-fade-in">
                        <template v-if="!showCartModal"> 
                            <!-- BANNERS -->
                            <div v-if="banners.length > 0" class="mt-4 px-4">
                                <div class="swiper banner-swiper !pb-8 rounded-2xl overflow-hidden">
                                    <div class="swiper-wrapper">
                                        <div v-for="banner in banners" :key="banner._id" class="swiper-slide">
                                            <div class="relative h-40 md:h-64 lg:h-80 w-full rounded-2xl overflow-hidden shadow-md group dark:shadow-none dark:border dark:border-slate-700">
                                                <img :src="banner.imageUrl" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex flex-col justify-end p-4">
                                                    <h3 class="text-white font-bold text-lg leading-tight drop-shadow-md">{{ banner.title }}</h3>
                                                    <p v-if="banner.description" class="text-white/90 text-xs mt-1 line-clamp-1 drop-shadow-md">{{ banner.description }}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="swiper-pagination !bottom-0"></div>
                                </div>
                            </div>

                            <!-- CATEGORIES -->
                            <div class="sticky top-[95px] md:top-[98px] lg:top-[102px] z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur py-4 px-6 rounded-2xl border-b border-slate-100 dark:border-slate-800 mb-4 transition-colors duration-300">
                                <div class="flex space-x-3 overflow-x-auto hide-scroll pb-1">
                                    <button @click="selectedCategory = 'all'" class="flex flex-col items-center min-w-[70px] transition-all duration-200 group" :class="selectedCategory === 'all' ? 'opacity-100 scale-105' : 'opacity-60 hover:opacity-100'">
                                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-1 shadow-sm transition-colors duration-300" :class="selectedCategory === 'all' ? 'bg-primary text-white shadow-primary/30' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'"><i class="fa-solid fa-utensils text-xl"></i></div>
                                        <span class="text-xs font-medium truncate w-full text-center" :class="selectedCategory === 'all' ? 'text-primary font-bold' : 'text-slate-500 dark:text-slate-400'">Todo</span>
                                    </button>
                                    <button v-for="cat in categories" :key="cat._id" @click="selectedCategory = cat._id" class="flex flex-col items-center min-w-[70px] transition-all duration-200 group" :class="selectedCategory === cat._id ? 'opacity-100 scale-105' : 'opacity-60 hover:opacity-100'">
                                        <div class="w-14 h-14 rounded-2xl overflow-hidden mb-1 shadow-sm border-2 transition-colors duration-300 bg-slate-100 dark:bg-slate-800" :class="selectedCategory === cat._id ? 'border-primary' : 'border-transparent dark:border-slate-700'">
                                            <img v-if="cat.image" :src="cat.image" class="w-full h-full object-cover">
                                            <div v-else class="w-full h-full flex items-center justify-center text-slate-400"><i class="fa-solid fa-bowl-food"></i></div>
                                        </div>
                                        <span class="text-xs font-medium truncate w-full text-center" :class="selectedCategory === cat._id ? 'text-primary font-bold' : 'text-slate-500 dark:text-slate-400'">{{ cat.name }}</span>
                                    </button>
                                </div>
                            </div>

                            <!-- PRODUCTS GRID -->
                            <div class="px-4 pb-24">
                                <div class="flex justify-between items-end mb-4">
                                    <h2 class="text-lg font-bold text-slate-800 dark:text-white">{{ selectedCategoryName }} <span class="text-xs font-normal text-slate-400 ml-1">({{ filteredProducts.length }})</span></h2>
                                    <span v-if="searchQuery" class="text-xs text-primary cursor-pointer" @click="searchQuery = ''">Borrar filtro</span>
                                </div>

                                <div v-if="filteredProducts.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                                    <div v-for="prod in filteredProducts" :key="prod._id" class="bg-white dark:bg-slate-900 rounded-2xl p-3 md:p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex gap-4 hover:shadow-md transition-shadow cursor-pointer" @click="initAddToCart(prod)">
                                        <div class="w-28 h-28 md:w-32 md:h-32 shrink-0 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 relative">
                                            <img :src="prod.image || 'https://via.placeholder.com/150'" class="w-full h-full object-cover">
                                            <span v-if="prod.salesCount > 10" class="absolute top-1 left-1 bg-yellow-400 text-[10px] font-bold px-1.5 py-0.5 rounded text-black shadow-sm">TOP</span>
                                        </div>
                                        
                                        <div class="flex-1 flex flex-col justify-between py-1">
                                            <div>
                                                <h3 class="font-bold text-slate-800 dark:text-slate-100 leading-snug line-clamp-2 md:text-lg group-hover:text-primary transition-colors">{{ prod.name }}</h3>
                                                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">{{ prod.description }}</p>
                                            </div>
                                            
                                            <div class="flex justify-between items-center mt-2 md:mt-3">
                                                <span class="text-lg md:text-xl font-bold text-slate-900 dark:text-white">${{ prod.price }}</span>
                                                <button @click.stop="initAddToCart(prod)" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-primary hover:bg-primary hover:text-white transition flex items-center justify-center shadow-sm">
                                                    <i class="fa-solid fa-plus md:text-lg"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div v-else class="text-center py-10">
                                    <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-300 dark:text-slate-600"><i class="fa-solid fa-utensils text-3xl"></i></div>
                                    <p class="text-slate-500 dark:text-slate-400 font-medium">No encontramos productos.</p>
                                </div>
                            </div>
                        </template>

                        <!-- Modal de Carrito -->
                        <template v-else>
                            <div class="bg-white dark:bg-slate-900 w-full max-w-3xl mx-auto sm:border sm:border-slate-200 dark:sm:border-slate-800 md:rounded-2xl shadow-none sm:shadow-2xl relative z-10 md:my-8 flex flex-col animate-slide-up">
                                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                                    <button @click="showCartModal = false" class="text-slate-400 hover:text-red-500">
                                        <i class="fa-solid fa-backspace text-xl"></i>
                                    </button>
                                    <h2 class="text-xl font-bold text-slate-800 dark:text-white">Tu Pedido</h2>
                                </div>

                                <div class="flex-1 overflow-y-auto p-6 space-y-6">
                                    <div v-if="cart.length === 0" class="text-center py-16 text-slate-400">
                                        <i class="fa-solid fa-basket-shopping text-6xl mb-4 opacity-50"></i>
                                        <p class="text-lg">Tu carrito está vacío.</p>
                                    </div>
                                    
                                    <div v-for="(item, idx) in cart" :key="idx" class="flex gap-4 items-center sm:items-start bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800">
                                        <div class="w-20 h-20 md:w-24 md:h-24 rounded-lg bg-slate-100 dark:bg-slate-800 shrink-0 overflow-hidden">
                                            <img :src="item.product.image || 'https://via.placeholder.com/150'" class="w-full h-full object-cover">
                                        </div>
                                        <div class="flex-1">
                                            <div class="flex justify-between items-start mb-1">
                                                <h4 class="font-bold text-slate-800 dark:text-white text-sm line-clamp-1 md:text-base">{{ item.product.name }}</h4>
                                                <span class="font-bold text-slate-900 dark:text-white text-sm md:text-base">${{ item.unitPrice * item.quantity }}</span>
                                            </div>
                                            <div v-if="item.selectedOptions && item.selectedOptions.length > 0" class="mb-2">
                                                <p v-for="opt in item.selectedOptions" :key="opt.name" class="text-xs text-slate-500 dark:text-slate-400 flex justify-between">
                                                    <span>+ {{ opt.name }}</span>
                                                    <span v-if="opt.priceExtra > 0">${{ opt.priceExtra }}</span>
                                                </p>
                                            </div>
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs text-slate-400">${{ item.unitPrice }} c/u</span>
                                                <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-1 h-7">
                                                    <button @click="decreaseCartItem(idx)" class="w-6 h-full flex items-center justify-center text-slate-500 hover:text-primary"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                                    <span class="mx-2 text-xs font-bold text-slate-800 dark:text-white">{{ item.quantity }}</span>

                                    </div>
                                </div>
                                <textarea v-model="newReview.comment" placeholder="'Excelente servicio, la comida llegó caliente...'" class="w-full mb-3 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 dark:text-white text-sm focus:outline-none focus:border-primary resize-none h-20"></textarea>
                                <button @click="submitReview" :disabled="submittingReview" class="w-full bg-slate-900 dark:bg-primary text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-50">
                                    <i v-if="submittingReview" class="fa-solid fa-circle-notch fa-spin"></i>
                                    <span v-else>Publicar Reseña</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    
        <!-- STRIPE PAYMENT MODAL -->
        <div v-if="showStripeModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
            <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden relative">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
                    <h3 class="font-bold text-lg flex items-center gap-2 dark:text-white"><i class="fa-solid fa-lock text-slate-400"></i> Pago Seguro</h3>
                    <button @click="showStripeModal = false" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div class="p-6">
                    <div class="mb-4">
                        <p class="text-sm text-slate-500 dark:text-slate-400 mb-2">Ingresa los datos de tu tarjeta:</p>
                        <div id="card-element" class="p-4 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-800"></div>
                        <p id="card-errors" role="alert" class="text-red-500 text-xs mt-2 font-medium" v-if="stripePaymentError">{{ stripePaymentError }}</p>
                    </div>
                    <div class="flex items-center gap-2 justify-center mt-6 mb-4">
                        <i class="fa-brands fa-stripe text-4xl text-indigo-500"></i>
                    </div>
                    <button @click="processStripePayment" :disabled="isProcessingPayment" class="w-full bg-slate-900 dark:bg-primary text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i v-if="isProcessingPayment" class="fa-solid fa-circle-notch fa-spin"></i>
                        <span v-else>Pagar ${{ cartTotalPrice?.toFixed(2) }}</span>
                    </button>

                    <!-- Separador con Icono de Correo -->
                    <div class="relative flex py-5 items-center">
                        <div class="flex-grow border-t border-slate-100 dark:border-slate-800"></div>
                        <span class="flex-shrink mx-4 bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-full w-8 h-8 flex items-center justify-center border border-slate-200 dark:border-slate-700 text-xs">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <div class="flex-grow border-t border-slate-100 dark:border-slate-800"></div>
                    </div>

                    <!-- Campo de Entrada de Correo Obligatorio -->
                    <div class="mb-4 text-left">
                        <h4 class="text-sm font-bold text-slate-800 dark:text-white mb-1">Para enviarte tu recibo de pago</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">Ingresa tu correo electrónico. Es obligatorio para que recibas tu comprobante.</p>
                        
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                                <i class="fa-regular fa-envelope"></i>
                            </div>
                            <input type="email" v-model="customerEmail" placeholder="Correo electrónico *" required
                                class="block w-full pl-10 pr-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-transparent text-sm">
                        </div>
                    </div>

                    <!-- Leyenda de Seguridad -->
                    <div class="flex items-center gap-1.5 justify-center text-slate-400 dark:text-slate-500 text-xs mt-5">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span>Tu información está segura y protegida.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL PROMOCIONAL DE REGISTRO -->
        <div v-if="showAuthPromptModal" class="fixed inset-0 z-[70] flex flex-col items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" @click="continueAsGuest"></div>
            
            <!-- Banner de Alerta para Checkout -->
            <div v-if="authPromptContext === 'checkout'" class="w-full max-w-[500px] mb-4 bg-[#1a1a1a] border border-red-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-4 relative z-10 animate-slide-up shadow-lg">
                <div class="w-10 h-10 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <div class="flex-1 text-center sm:text-left">
                    <h4 class="text-white font-bold text-sm">Guarda esta dirección para tus próximos pedidos</h4>
                    <p class="text-slate-400 text-xs mt-0.5">Inicia sesión o crea una cuenta y nunca vuelvas a escribir tu dirección.</p>
                </div>
            </div>

            <!-- Modal Principal -->
            <div class="relative bg-[#111111] border border-slate-700/50 rounded-3xl w-full max-w-[400px] shadow-2xl overflow-hidden animate-slide-up flex flex-col p-8 text-center z-10">
                
                <button @click="continueAsGuest" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-[#333333] rounded-full w-8 h-8 flex items-center justify-center transition">
                    <i class="fa-solid fa-times"></i>
                </button>

                <!-- Logo -->
                <div class="mx-auto w-[84px] h-[84px] bg-[#E30613] rounded-full flex items-center justify-center mb-6 relative">
                    <img src="assets/images/icon.jpg" alt="" class="w-full h-full object-cover rounded-full border-2 border-[#E30613]">
                    
                    <!-- Sparkles (Bigotes) Izquierda -->
                    <span class="absolute -left-4 top-2 text-[#FFC800] text-xl font-black rotate-[-30deg]">-</span>
                    <span class="absolute -left-5 top-5 text-[#FFC800] text-xl font-black">-</span>
                    <span class="absolute -left-4 top-8 text-[#FFC800] text-xl font-black rotate-[30deg]">-</span>
                    
                    <!-- Sparkles (Bigotes) Derecha -->
                    <span class="absolute -right-4 top-2 text-[#FFC800] text-xl font-black rotate-[30deg]">-</span>
                    <span class="absolute -right-5 top-5 text-[#FFC800] text-xl font-black">-</span>
                    <span class="absolute -right-4 top-8 text-[#FFC800] text-xl font-black rotate-[-30deg]">-</span>
                </div>

                <h2 class="text-2xl font-black text-white mb-2">Crea tu cuenta en 30 segundos</h2>
                <p class="text-slate-400 text-sm mb-8 leading-relaxed px-2">
                    Guarda tus direcciones, consulta tus pedidos y ordena mucho más rápido.
                </p>

                <div class="flex flex-col gap-3">
                    <button @click="showAuthPromptModal = false; openModal('login')" class="w-full py-3.5 bg-[#E30613] hover:brightness-90 text-white font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-user"></i>
                        <span>Iniciar sesión</span>
                    </button>
                    
                    <button @click="showAuthPromptModal = false; openModal('register')" class="w-full py-3.5 bg-[#FFC800] hover:brightness-95 text-[#111111] font-black rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Crear cuenta</span>
                    </button>
                </div>


            </div>
        </div>
    </template>
</div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/front/shared-customer.js?v=3"></script>
    <script src="./assets/js/front/app.js?v=3"></script>
    <script src="./assets/js/front/cookie-consent.js?v=3"></script>
</body>
</html>
